<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- 確保在行動裝置上的顯示比例正確，不可雙指放大干擾掃描 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>現場報到系統 (工作人員專用)</title>
  <!-- 引入強大的相機解讀套件 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
    
    :root {
      --primary: #2563EB;
      --success: #10B981;
      --error: #EF4444;
      --bg: #111827;
      --surface: #1F2937;
      --text: #F9FAFB;
    }

    body {
      font-size: 18px !important;
      font-weight: 500;
      letter-spacing: 0.5px;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* 登入遮罩 */
    #loginOverlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px;
    }
    .login-box {
      background: var(--surface); padding: 40px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 320px;
    }
    .login-box h2 { margin-top: 0; color: white; }
    .login-box input {
      width: 100%; padding: 15px; font-size: 24px; text-align: center;
      border-radius: 8px; border: none; margin-bottom: 20px; box-sizing: border-box; letter-spacing: 5px;
    }
    .login-box button {
      width: 100%; padding: 15px; background: var(--primary); color: white;
      border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
    }

    .header {
      width: 100%; padding: 15px; text-align: center;
      background-color: var(--surface); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); z-index: 10;
    }
    .header h1 { margin: 0; font-size: 18px; color: #60A5FA; }

    #reader-container {
      flex: 1; width: 100%; max-width: 600px;
      display: flex; flex-direction: column; position: relative;
    }
    #reader { width: 100%; }

    /* html5-qrcode 相機權限按鈕美化 */
    #reader button {
      background: var(--primary); color: white; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; margin: 10px; font-size: 14px;
    }
    #reader select { padding: 8px; margin-bottom: 10px; max-width: 90%; }
    
    .fallback-btn {
      background: #0284C7; color: white; border: none; padding: 12px; margin: 10px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center;
    }

    /* Overlay UI for success/error */
    .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(17, 24, 39, 0.95); z-index: 50;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; text-align: center;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .overlay.active { transform: translateY(0); }
    .overlay.success { border-top: 8px solid var(--success); }
    .overlay.error { border-top: 8px solid var(--error); }
    .overlay.loading { border-top: 8px solid var(--primary); }

    .result-icon { font-size: 72px; margin-bottom: 20px; }
    .success .result-icon { color: var(--success); }
    .error .result-icon { color: var(--error); }

    .participant-info {
      background: white; color: #111827; padding: 30px; border-radius: 16px;
      width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .info-label { font-size: 14px; color: #4B5563; margin-bottom: 4px; }
    .info-value { font-size: 28px; font-weight: bold; color: #111827; margin-bottom: 20px; }
    .info-value.name { font-size: 42px; color: var(--primary); margin-bottom: 0; }

    .error-msg { font-size: 24px; font-weight: bold; }
    .loader {
      border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--primary);
      border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    .overlay-btn {
      margin-top: 30px; background: var(--primary); color: white; border: none;
      padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 密碼登入畫面 -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2>工作人員登入</h2>
      <p style="color: #9CA3AF; font-size: 14px; margin-bottom: 20px;">請輸入報到系統專用密碼</p>
      <input type="password" id="staffPin" placeholder="密碼 (預設8888)">
      <button onclick="checkLogin()">登入掃描系統</button>
      <p id="loginError" style="color: #EF4444; margin-top: 15px; display: none;">密碼錯誤！</p>
    </div>
  </div>

  <div class="header">
    <h1>現場報到即時掃描後台</h1>
    <div id="connectionStatus" style="font-size: 12px; color: #10B981; margin-top: 3px;">✅ 系統就緒</div>
  </div>

  
  <div style="display: flex; width: 100%; max-width: 600px; padding: 10px; box-sizing: border-box;">
    <button id="btnScanMode" onclick="setMode('scan')" style="flex: 1; padding: 12px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px 0 0 8px;">📷 掃描模式</button>
    <button id="btnManualMode" onclick="setMode('manual')" style="flex: 1; padding: 12px; background: #374151; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 0 8px 8px 0;">📋 手動名單</button>
  </div>

  <div id="manual-container" style="display: none; width: 100%; max-width: 600px; padding: 10px; box-sizing: border-box; flex-direction: column;">
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <button id="schoolFilterBtn" onclick="openSchoolModal()" style="flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #374151; background: #1F2937; color: white; font-size: 16px; text-align: left; cursor: pointer;">-- 顯示全部學校 --</button>
      <button onclick="fetchUncheckedIn()" style="background: var(--primary); color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">↻ 重整</button>
    </div>
    
    <div id="manualList" style="background: var(--surface); border-radius: 8px; max-height: calc(100vh - 250px); overflow-y: auto;">
       <div style="padding: 20px; text-align: center; color: #9CA3AF;">請先點擊「重整」載入名單</div>
    </div>
  </div>

  <div id="reader-container">
    <div id="reader"></div>
    
    <!-- 手機備用區塊 -->
    <div style="text-align: center; margin-top: 10px;">
        <div style="color: #9CA3AF; font-size: 13px; margin-bottom: 10px;">若是鏡頭異常，可點此備用按鈕拍照：</div>
        <input type="file" id="fallbackCamera" accept="image/*" capture="environment" style="display: none;">
        <button class="fallback-btn" onclick="document.getElementById('fallbackCamera').click()">
          📸 啟動拍照輔助模式
        </button>
    </div>
    
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #374151; display:flex; gap:10px; margin-left: 10px; margin-right:10px;">
       <input type="text" id="manualCode" placeholder="或是手動輸入報到序號" style="flex:1; padding: 12px; border-radius: 6px; border:none; text-align:center;">
       <button onclick="checkManualCode()" style="background:var(--success); color:white; border:none; padding:12px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">手動報到</button>
    </div>
  </div>

  <!-- 用來執行拍照解碼的隱藏區塊 -->
  <div id="file-scanner-reader" style="display: none;"></div>

  <!-- Loading State -->
  <div id="overlayLoading" class="overlay loading">
    <div class="loader"></div>
    <h2>報到資料處理中...</h2>
  </div>

  <!-- Success State -->
  <div id="overlaySuccess" class="overlay success">
    <div class="result-icon">✓</div>
    <div class="participant-info">
      <div class="info-label">服務單位</div>
      <div class="info-value" id="resUnit">某某單位</div>
      <div class="info-label">職稱</div>
      <div class="info-value" id="resTitle">專案經理</div>
      <div class="info-label">姓名</div>
      <div class="info-value name" id="resName">王小明</div>
    </div>
    <button class="overlay-btn" onclick="closeOverlay()">繼續下一位 (或自動關閉)</button>
  </div>

  <!-- Error State -->
  <div id="overlayError" class="overlay error">
    <div class="result-icon">✗</div>
    <div class="error-msg" id="resError">重複報到或無此序號</div>
    <button class="overlay-btn" onclick="closeOverlay()" style="background:var(--error);">關閉並繼續</button>
  </div>

  
  <!-- 學校選擇彈出視窗 -->
  <div id="schoolModal" class="overlay" style="z-index: 999; padding: 0;">
    <div style="background: #1F2937; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; max-height: 80vh; text-align: left;">
      <h3 style="margin-top: 0; color: white; text-align: center; margin-bottom: 15px;">選擇學校</h3>
      <input type="text" id="schoolSearchInput" placeholder="輸入關鍵字搜尋學校..." oninput="filterSchoolModal()" style="padding: 12px; border-radius: 6px; border: 1px solid #374151; background: #111827; color: white; margin-bottom: 15px; font-size: 16px;">
      <div id="schoolModalList" style="overflow-y: auto; flex: 1; border-radius: 6px; background: #111827; border: 1px solid #374151;">
        <!-- Schools will be injected here -->
      </div>
      <button onclick="closeSchoolModal()" style="margin-top: 15px; background: #4B5563; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; text-align: center;">取消</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ 請在下方雙引號中，貼上您 Google Apps Script 的「部署網址」!
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwb1O2nBCzYA-SWvICOUIR9RRcj3NMwlUNH3dd5_aJ72gYfdwFP16D_Dz_7q_QL-TVT/exec";
    // ==========================================

    const CORRECT_PIN = "8888"; // 工作人員密碼

    let html5QrcodeScanner;
    let isProcessing = false;
    let autoCloseTimer;

    // --- 登入驗證與快取下載 ---
    let localDB = {}; // 儲存所有人的資料 { uid: { name, unit, title, status } }

    function checkLogin() {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf("script.google.com") === -1) {
            alert("⚠️ 錯誤：尚未綁定 Google App Script 網址。\n請利用記事本編輯此 HTML 檔案，填入正確的 GAS_WEB_APP_URL。");
            return;
        }

        let input = document.getElementById('staffPin').value;
        if (input !== CORRECT_PIN) {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('loginError').innerText = '密碼錯誤！';
            return;
        }

        const btn = document.querySelector('.login-box button');
        document.getElementById('loginError').style.display = 'none'; // 清除舊錯誤

        // 【極速優化】如果手機已經有下載過名單 (快取)，瞬間進入系統！
        let cachedData = localStorage.getItem('scannerDB_115');
        if (cachedData) {
            try {
                localDB = JSON.parse(cachedData);
                document.getElementById('loginOverlay').style.display = 'none';
                initScanner(); // 0秒瞬間開啟相機

                // 背景默默更新最新狀態（不影響工作人員使用）
                attemptDownload(null, 0, true);
                return;
            } catch(e) {}
        }

        // 第一次使用，需要等待下載
        btn.innerText = "下載名單中...";
        btn.disabled = true;
        attemptDownload(btn, 0, false);
    }

    // 自動重試下載，不需要使用者手動按多次
    function attemptDownload(btn, attempt, isBackground) {
        const MAX_ATTEMPTS = 4;
        const ADMIN_PWD = "u1208AU4GJTJ";
        const cbName = 'cb_' + Math.round(1000000 * Math.random());
        const requestUrl = GAS_WEB_APP_URL + "?action=getAllData&pwd=" + ADMIN_PWD + "&callback=" + cbName;

        if (btn && attempt > 0) {
            btn.innerText = "重新連線中 (" + attempt + "/" + (MAX_ATTEMPTS-1) + ")...";
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000); // 12 秒後放棄這次嘗試

        fetch(requestUrl, { method: "GET", mode: "cors", signal: controller.signal })
            .then(r => r.text())
            .then(text => {
                clearTimeout(timeoutId);
                let jsonString = text.replace(cbName + "(", "").replace(/\)$/, "");
                let data = JSON.parse(jsonString);
                if (data.error) throw new Error(data.error);

                // 成功！建立本地 Dictionary
                let newDB = {};
                data.forEach(p => {
                    if (p['UID']) {
                        newDB[p['UID']] = {
                            name: p['姓名'] || "",
                            unit: (p['學校機關名稱'] || p['學校'] || p['服務單位'] || ""),
                            title: p['職稱'] || "",
                            status: p['報到狀態'] || "未報到"
                        };
                    }
                });
                localDB = newDB;
                localStorage.setItem('scannerDB_115', JSON.stringify(localDB)); // 存快取

                if (!isBackground) {
                    // 第一次登入，進入掃描系統
                    document.getElementById('loginOverlay').style.display = 'none';
                    initScanner();
                }
                // 背景更新完成，不需要任何動作
            })
            .catch(err => {
                clearTimeout(timeoutId);
                if (isBackground) return; // 背景更新失敗無所謂，不打擾工作人員

                if (attempt < MAX_ATTEMPTS - 1) {
                    // 自動重試，不顯示錯誤，延遲 1 秒後再試
                    setTimeout(() => attemptDownload(btn, attempt + 1, false), 1000);
                } else {
                    // 嘗試了 4 次都失敗，才顯示錯誤
                    if (btn) {
                        btn.innerText = "登入掃描系統";
                        btn.disabled = false;
                    }
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('loginError').innerText = '網路連線失敗，請換個網路再試！';
                }
            });
    }

    // 支援按 Enter 登入
    document.getElementById('staffPin').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkLogin();
    });

    
    // --- 手動名單模式邏輯 ---
    let uncheckedAttendees = [];

    function setMode(mode) {
      if (mode === 'scan') {
        document.getElementById('btnScanMode').style.background = 'var(--primary)';
        document.getElementById('btnManualMode').style.background = '#374151';
        document.getElementById('reader-container').style.display = 'flex';
        document.getElementById('manual-container').style.display = 'none';
      } else {
        document.getElementById('btnScanMode').style.background = '#374151';
        document.getElementById('btnManualMode').style.background = 'var(--primary)';
        document.getElementById('reader-container').style.display = 'none';
        document.getElementById('manual-container').style.display = 'flex';
        if (uncheckedAttendees.length === 0) {
          fetchUncheckedIn();
        }
      }
    }

    function fetchUncheckedIn() {
      const manualList = document.getElementById('manualList');
      document.getElementById('schoolFilterBtn').textContent = "載入中..."; currentSelectedSchool = "";

      // 直接從登入時載入的 localDB 取出未報到名單，瞬間完成！
      uncheckedAttendees = [];
      for (let uid in localDB) {
          if (localDB[uid].status !== "已報到") {
              uncheckedAttendees.push({
                  uid: uid,
                  name: localDB[uid].name,
                  school: localDB[uid].unit
              });
          }
      }
      
      populateSchoolFilter();
      renderManualList();
    }

    
    let currentSelectedSchool = "";
    let uniqueSchools = [];

    function openSchoolModal() {
      document.getElementById('schoolModal').classList.add('active');
      document.getElementById('schoolSearchInput').value = '';
      renderSchoolModalList(uniqueSchools);
      setTimeout(() => { document.getElementById('schoolSearchInput').focus(); }, 300);
    }

    function closeSchoolModal() {
      document.getElementById('schoolModal').classList.remove('active');
    }

    function renderSchoolModalList(list) {
      const container = document.getElementById('schoolModalList');
      container.innerHTML = '';
      
      const allOpt = document.createElement('div');
      allOpt.style = "padding: 12px 15px; border-bottom: 1px solid #374151; cursor: pointer; color: white;";
      allOpt.textContent = "-- 顯示全部 (不限學校) --";
      allOpt.onclick = () => selectSchool("");
      container.appendChild(allOpt);

      if (list.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style = "padding: 12px 15px; color: #9CA3AF; text-align: center;";
        emptyMsg.textContent = "沒有找到符合的學校";
        container.appendChild(emptyMsg);
        return;
      }

      list.forEach(s => {
        const item = document.createElement('div');
        item.style = "padding: 12px 15px; border-bottom: 1px solid #374151; cursor: pointer; color: white;";
        item.textContent = s;
        item.onclick = () => selectSchool(s);
        container.appendChild(item);
      });
    }

    function filterSchoolModal() {
      const keyword = document.getElementById('schoolSearchInput').value.trim().toLowerCase();
      if (!keyword) {
        renderSchoolModalList(uniqueSchools);
        return;
      }
      const filtered = uniqueSchools.filter(s => s.toLowerCase().includes(keyword));
      renderSchoolModalList(filtered);
    }

    function selectSchool(schoolName) {
      currentSelectedSchool = schoolName;
      document.getElementById('schoolFilterBtn').textContent = schoolName ? "🔍 " + schoolName : "🔍 點選搜尋 / 過濾學校...";
      closeSchoolModal();
      filterManualList();
    }

    function populateSchoolFilter() {
      uniqueSchools = [...new Set(uncheckedAttendees.map(a => a.school))].filter(s => s).sort();
      // Update current button text
      if (!currentSelectedSchool) {
          document.getElementById('schoolFilterBtn').textContent = "🔍 點選搜尋 / 過濾學校...";
      } else if (!uniqueSchools.includes(currentSelectedSchool)) {
          currentSelectedSchool = "";
          document.getElementById('schoolFilterBtn').textContent = "🔍 點選搜尋 / 過濾學校...";
          filterManualList();
      }
    }

    function filterManualList() {
      renderManualList();
    }

    function renderManualList() {
      const manualList = document.getElementById('manualList');
      const selectedSchool = currentSelectedSchool;
      manualList.innerHTML = '';

      const filtered = uncheckedAttendees.filter(a => {
        if (selectedSchool && a.school !== selectedSchool) return false;
        return true;
      });

      if (filtered.length === 0) {
        manualList.innerHTML = '<div style="padding: 20px; text-align: center; color: #9CA3AF;">沒有找到符合的未報到人員</div>';
        return;
      }

      filtered.forEach(a => {
        const item = document.createElement('div');
        item.style = 'padding: 15px; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center;';
        item.innerHTML = `
          <div>
            <div style="font-weight: bold; font-size: 18px; color: white; margin-bottom: 4px;">${a.name}</div>
            <div style="color: #9CA3AF; font-size: 14px;">${a.school}</div>
          </div>
          <button onclick="manualCheckIn('${a.uid}')" style="background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">報到</button>
        `;
        manualList.appendChild(item);
      });
    }

    function manualCheckIn(uid) {
      if (!confirm('確定要為此人員報到嗎？')) return;
      processCheckIn(uid);
      
      // Remove from list after a short delay so the user sees the success overlay
      setTimeout(() => {
        uncheckedAttendees = uncheckedAttendees.filter(a => a.uid !== uid);
        renderManualList();
        
        // Check if the current selected school has no more unchecked attendees
        const selectedSchool = currentSelectedSchool;
        if (selectedSchool) {
            const hasMore = uncheckedAttendees.some(a => a.school === selectedSchool);
            if (!hasMore) populateSchoolFilter();
        } else {
            populateSchoolFilter();
        }
      }, 2000);
    }

    // --- 手動輸入 ---
    function checkManualCode() {
        let code = document.getElementById('manualCode').value.trim();
        if (code !== "") {
            processCheckIn(code);
            document.getElementById('manualCode').value = "";
        }
    }

    // --- 相機初始化 ---
    function initScanner() {
      // 解決前置鏡頭問題：強制使用後置相機 (環境相機)
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 10, 
        qrbox: {width: 250, height: 250},
        aspectRatio: 1.0,
        videoConstraints: {
          facingMode: "environment" // 強制後畫面
        }
      }, false);
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }
    
    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      processCheckIn(decodedText);
    }

    function onScanFailure(error) { }

    // --- 拍照上傳分析 (加入 Canvas 壓縮解法) ---
    document.getElementById('fallbackCamera').addEventListener('change', function(e) {
        if (e.target.files.length == 0) return;
        let file = e.target.files[0];
        document.getElementById('overlayLoading').classList.add('active'); 
        
        let img = new Image();
        let url = URL.createObjectURL(file);

        img.onload = function() {
            let canvas = document.createElement("canvas");
            let ctx = canvas.getContext("2d");
            let maxDim = 800;
            let width = img.width, height = img.height;
            if (width > height && width > maxDim) {
                height = Math.round(height * (maxDim / width)); width = maxDim;
            } else if (height > maxDim) {
                width = Math.round(width * (maxDim / height)); height = maxDim;
            }
            canvas.width = width; canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            
            canvas.toBlob(function(blob) {
                let resizedFile = new File([blob], "compressed_qr.jpg", { type: "image/jpeg" });
                const html5QrCode = new Html5Qrcode("file-scanner-reader");
                
                html5QrCode.scanFile(resizedFile, true)
                .then(decodedText => {
                    document.getElementById('overlayLoading').classList.remove('active');
                    processCheckIn(decodedText);
                    e.target.value = ''; URL.revokeObjectURL(url);
                })
                .catch(err => {
                    document.getElementById('overlayLoading').classList.remove('active');
                    alert("❌ 依然無法解析此照片。請確認條碼置中並無嚴重反光，或直接使用下方手動輸入。");
                    e.target.value = ''; URL.revokeObjectURL(url);
                });
            }, "image/jpeg", 0.9);
        };
        img.src = url;
    });

    // --- 實體條碼槍輸入驗證 ---
    let barcodeBuffer = "";
    let lastKeyTime = 0;
    window.addEventListener("keydown", function(e) {
      if (isProcessing || document.getElementById('loginOverlay').style.display !== 'none') return;
      let currentTime = new Date().getTime();
      if (currentTime - lastKeyTime > 50) barcodeBuffer = "";
      lastKeyTime = currentTime;

      if (e.key === "Enter") {
        if (barcodeBuffer.length > 3) {
          e.preventDefault();
          let scannedCode = barcodeBuffer;
          barcodeBuffer = "";
          processCheckIn(scannedCode);
        }
      } else if (e.key.length === 1) {
        barcodeBuffer += e.key;
      }
    });

    // --- 極速報到處理邏輯 (離線快取 + 背景同步) ---  
    function processCheckIn(code) {
      if (isProcessing) return;
      isProcessing = true;
      try {
        if (html5QrcodeScanner) html5QrcodeScanner.pause(true);
      } catch(e) {}
      
      // 容錯機制：如果掃到舊版的 QR Code (是一長串網址)，自動提取最後的 UID
      let finalUid = code;
      if (code.includes("uid=")) {
          finalUid = code.split("uid=")[1].split("&")[0];
      }

      // 1. 本地極速比對
      let participant = localDB[finalUid];
      
      if (!participant) {
        // 找不到資料
        document.getElementById('resError').innerText = "查無此報名資料，請確認是否為本次活動條碼！\nUID: " + finalUid;
        document.getElementById('overlayError').classList.add('active');
        playAudio("https://www.soundjay.com/buttons/sounds/button-10.mp3");
        autoCloseTimer = setTimeout(closeOverlay, 2000); // 錯誤畫面顯示稍長一點
      } else if (participant.status === "已報到") {
        // 重複報到
        document.getElementById('resError').innerText = "此人已報到過了！\n姓名：" + participant.name;
        document.getElementById('overlayError').classList.add('active');
        playAudio("https://www.soundjay.com/buttons/sounds/button-10.mp3");
        autoCloseTimer = setTimeout(closeOverlay, 1500);
      } else {
        // 2. 報到成功 - 畫面瞬間(0ms)跳轉綠色
        participant.status = "已報到"; // 立即更新本地狀態
        
        document.getElementById('resUnit').innerText = participant.unit;
        document.getElementById('resTitle').innerText = participant.title;
        document.getElementById('resName').innerText = participant.name;
        
        document.getElementById('overlaySuccess').classList.add('active');
        playAudio("https://www.soundjay.com/buttons/sounds/button-09.mp3");
        
        // 極速冷卻時間：縮短為 0.8 秒即可繼續掃下一個
        autoCloseTimer = setTimeout(closeOverlay, 800);
        
        // 3. 背景非同步上傳 (不需要等待它完成)
        syncCheckInToGoogle(finalUid);
      }
    }

    // --- 背景寫入 Google 試算表 ---
    function syncCheckInToGoogle(uid) {
        let cbName = 'jsonpSync_' + Math.round(100000 * Math.random());
        let requestUrl = GAS_WEB_APP_URL + "?action=toggleCheckIn&status=已報到&uid=" + encodeURIComponent(uid) + "&pwd=u1208AU4GJTJ&callback=" + cbName;
        
        // 改用 fetch 突破 Safari 阻擋跨網域 <script> 的限制
        fetch(requestUrl, { method: "GET", mode: "cors" })
            .then(res => res.text())
            .then(text => {
                console.log("背景上傳成功:", uid);
            })
            .catch(err => {
                console.error("背景連線異常，報到資料可能未成功上傳，但本地已記錄。");
            });
    }

    function closeOverlay() {
      clearTimeout(autoCloseTimer);
      document.getElementById('overlaySuccess').classList.remove('active');
      document.getElementById('overlayError').classList.remove('active');
      document.getElementById('overlayLoading').classList.remove('active');
      setTimeout(() => {
        isProcessing = false;
        try {
          if (html5QrcodeScanner) html5QrcodeScanner.resume(); // 喚醒相機
        } catch(e) { }
      }, 200); // 縮短重新啟動相機的等待時間
    }
    
    function playAudio(url) {
      try { new Audio(url).play().catch(e=>{}); } catch(e) {}
    }
  </script>
</body>
